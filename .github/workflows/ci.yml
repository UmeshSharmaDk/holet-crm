name: CI

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: holet_test
        ports:
          - 5432:5432
        # Without this the job races the container and the first query fails.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/holet_test
      JWT_SECRET: ci-only-secret-not-used-anywhere-real
      # A fixed, obviously-not-real 32-byte key. idFileStore.ts throws at
      # import if this is missing or not 64 hex characters, same as JWT_SECRET.
      ID_SCAN_ENCRYPTION_KEY: "2b42f5d6f96957eaa7b74d04c7342ac17ed5fbb0a14c0611a23f32b6b4de7e59"
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # Pinned to the version that generated pnpm-lock.yaml. The action has
          # no default and fails outright without either this or a
          # packageManager field in the root package.json.
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Apply schema
        run: pnpm --filter @workspace/db exec drizzle-kit push --config ./drizzle.config.ts --force

      - name: Test
        run: pnpm --filter @workspace/api-server run test

      - name: Build
        # NODE_ENV=test (set above for the DB push and test run) must not reach this
        # step: babel-preset-expo's expo-router plugin skips inlining
        # EXPO_ROUTER_APP_ROOT under NODE_ENV=test (it assumes Jest owns routing then),
        # which leaves `require.context(process.env.EXPO_ROUTER_APP_ROOT, ...)`
        # un-inlined and fails Metro's static analysis of require.context's first
        # argument — the "HTTP 500" this job used to report with no other detail.
        run: pnpm run build
        env:
          NODE_ENV: production
